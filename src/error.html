<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status%</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 16px;
				padding: 0 24px;
				text-align: center;
				background:
					radial-gradient(120% 90% at 15% -10%, #17301f 0%, transparent 55%),
					radial-gradient(90% 70% at 100% 0%, #0e2417 0%, transparent 45%), #050a07;
				color: #f4f7f3;
				font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
			}

			.status {
				font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
				font-weight: 800;
				font-size: 48px;
				line-height: 1;
				color: #b6ff3a;
			}

			.message {
				margin: 0;
				max-width: 28rem;
				font-size: 14px;
				color: #aeb9b2;
			}
		</style>
	</head>
	<body>
		<div class="status">%sveltekit.status%</div>
		<p class="message">%sveltekit.error.message%</p>
	</body>
</html>
